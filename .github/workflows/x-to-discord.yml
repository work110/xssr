name: X to Discord

on:
  workflow_dispatch:
  schedule:
    # 改成約每 45 分鐘一次，降低 X 429 機率。
    # 每小時 07 分與 52 分。
    - cron: "7,52 * * * *"

permissions:
  contents: write

concurrency:
  group: x-to-discord
  cancel-in-progress: false

jobs:
  fetch-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Random delay before X request
        run: |
          python - <<'PY'
          import random, time
          delay = random.randint(10, 50)
          print(f"Random pre-delay: {delay}s")
          time.sleep(delay)
          PY

      - name: Fetch X and send Discord
        env:
          X_HANDLE: "WhereWindsMeet_"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_NAME: "燕雲官方情報"
          SEND_LATEST_ON_FIRST_RUN: "true"
          REQUEST_TIMEOUT: "25"
          MAX_RETRIES: "4"
        run: python main.py

      - name: Save state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update X post state"
              git push
            fi
          fi
